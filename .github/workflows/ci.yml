name: CI

on:
  push:
  pull_request:

permissions: {}

jobs:
  lint:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Verify go.mod is tidy
        run: go mod tidy -diff

      - name: Check linter configuration
        run: make lint-config

      - name: Lint
        run: make lint

  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Test
        run: make test

  # Deploys the controller to a kind cluster, so it checks the manifests, not the reconcile logic.
  # It runs beside the build without gating it, because ArgoCD rolls the image out afterwards.
  test-e2e:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Install kind
        run: |
          curl -Lo ./kind https://kind.sigs.k8s.io/dl/latest/kind-linux-$(go env GOARCH)
          chmod +x ./kind
          sudo mv ./kind /usr/local/bin/kind

      - name: Run e2e tests
        run: make test-e2e

  build-and-push:
    runs-on: ubuntu-26.04-arm
    needs: [lint, test]
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/arm64
          sbom: true
          push: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
          tags: |
            ghcr.io/cujarrett/temporal-controller:main
            ghcr.io/cujarrett/temporal-controller:sha-${{ github.sha }}

  deploy:
    runs-on: ubuntu-latest
    needs: build-and-push
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Mint app token
        id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: Iv23liNyzLKWP1khuH23
          private-key: ${{ secrets.HOMELAB_APP_KEY }}
          repositories: homelab

      # The CRD is generated from api/, so CI writes the copy ArgoCD applies.
      # A stale schema in the cluster fails silently.
      - name: Push the generated CRD to homelab
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          SRC="config/crd/bases/temporal.local.lab_temporalnamespaces.yaml"
          FILE="cluster/temporal-controller/crd.yaml"
          REPO="cujarrett/homelab"

          FILE_SHA=$(gh api /repos/$REPO/contents/$FILE --jq '.sha')
          CURRENT=$(gh api /repos/$REPO/contents/$FILE --jq '.content' | tr -d '\n' | base64 -d)

          if [ "$CURRENT" = "$(cat $SRC)" ]; then
            echo "CRD unchanged"
            exit 0
          fi

          gh api --method PUT /repos/$REPO/contents/$FILE \
            -f message="chore: sync temporal-controller CRD" \
            -f content="$(base64 -w 0 < $SRC)" \
            -f sha="$FILE_SHA"

      - name: Update image tag in homelab
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          FILE="cluster/temporal-controller/deployment.yaml"
          IMAGE="ghcr.io/cujarrett/temporal-controller"
          REPO="cujarrett/homelab"
          SHA_TAG="sha-${GITHUB_SHA}"

          FILE_SHA=$(gh api /repos/$REPO/contents/$FILE --jq '.sha')
          CONTENT=$(gh api /repos/$REPO/contents/$FILE --jq '.content' | tr -d '\n' | base64 -d)
          UPDATED=$(echo "$CONTENT" | sed "s|image: ${IMAGE}:.*|image: ${IMAGE}:${SHA_TAG}|")

          gh api --method PUT /repos/$REPO/contents/$FILE \
            -f message="chore: deploy temporal-controller ${SHA_TAG}" \
            -f content="$(echo "$UPDATED" | base64 -w 0)" \
            -f sha="$FILE_SHA"
